services:
  traefik:
    image: docker.io/traefik:v3.7@sha256:b7b1b31e6440de0b1f7c4e0f6cf0a0f3f004866761d30c025fe00c80daaf7d9c
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=bridge"
      - "--entrypoints.web.address=:80"
    ports:
      - target: 80
        published: 8000
        mode: host
      - target: 8080
        published: 8080
        mode: host
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"
    networks:
      - bridge-net
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=bridge"
        - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
        - "traefik.http.routers.api.service=api@internal"

networks:
  bridge-net:
    external: true
    name: bridge
