services:
  traefik:
    image: docker.io/traefik:v3.8@sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=bridge"
      - "--entrypoints.web.address=:80"
    ports:
      - target: 80
        published: 8000
        mode: host
      - target: 8080
        published: 8080
        mode: host
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"
    networks:
      - bridge-net
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=bridge"
        - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
        - "traefik.http.routers.api.service=api@internal"

networks:
  bridge-net:
    external: true
    name: bridge
